<svg width="1000" height="760" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6E6555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#B8860B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="1000" height="760" fill="#100E0A"/>

<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F2EEE5">RecoverIQ Architecture</text>
<text x="500" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#A69C88">AI investigates and recommends. Deterministic systems decide and control.</text>

<!-- Payment failed -->
<rect x="400" y="95" width="200" height="50" rx="8" fill="#1B1712" stroke="#332C22"/>
<text x="500" y="125" text-anchor="middle" font-family="Arial" font-size="14" fill="#F2EEE5">Payment fails</text>

<line x1="500" y1="145" x2="500" y2="175" stroke="#6E6555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Agent box -->
<rect x="330" y="178" width="340" height="110" rx="10" fill="#241F18" stroke="#9C97E8" stroke-width="1.5"/>
<text x="500" y="204" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#9C97E8">Investigation Agent</text>
<text x="500" y="224" text-anchor="middle" font-family="Arial" font-size="11" fill="#A69C88">Gemini + function calling -- reasons only</text>
<text x="500" y="248" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#8A8068">get_payment_details · get_customer_history</text>
<text x="500" y="264" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#8A8068">predict_recovery_probability (ML) · calculate_expected_value</text>
<text x="500" y="280" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#8A8068">Outputs: top pick + ALL 5 candidates, evidence-grounded</text>

<line x1="500" y1="288" x2="500" y2="318" stroke="#6E6555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Decision engine -->
<rect x="330" y="321" width="340" height="82" rx="10" fill="#241F18" stroke="#E3B341" stroke-width="1.5"/>
<text x="500" y="346" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#E3B341">Decision Engine (deterministic)</text>
<text x="500" y="366" text-anchor="middle" font-family="Arial" font-size="11" fill="#A69C88">Picks winner from candidates per merchant mode</text>
<text x="500" y="384" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#8A8068">MAX_RECOVERY  ·  BALANCED  ·  MIN_FRICTION</text>

<line x1="500" y1="403" x2="500" y2="433" stroke="#6E6555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Policy engine -->
<rect x="330" y="436" width="340" height="90" rx="10" fill="#241F18" stroke="#E5766B" stroke-width="1.5"/>
<text x="500" y="461" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#E5766B">Policy Engine (deterministic)</text>
<text x="500" y="481" text-anchor="middle" font-family="Arial" font-size="11" fill="#A69C88">Retry limit · high-value review · consent · duplicate action</text>
<text x="500" y="503" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#F2EEE5">ALLOW &#8226; REVIEW &#8226; BLOCK</text>

<!-- Three branches -->
<line x1="420" y1="526" x2="250" y2="570" stroke="#6E6555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="526" x2="500" y2="570" stroke="#6E6555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580" y1="526" x2="770" y2="570" stroke="#B8860B" stroke-width="1.8" marker-end="url(#arrow-gold)"/>

<rect x="150" y="573" width="200" height="60" rx="8" fill="#1B1712" stroke="#332C22"/>
<text x="250" y="598" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#6FCF97">BLOCK</text>
<text x="250" y="616" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#A69C88">rejection reason sent back</text>

<rect x="400" y="573" width="200" height="60" rx="8" fill="#1B1712" stroke="#332C22"/>
<text x="500" y="598" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#9C97E8">REVIEW</text>
<text x="500" y="616" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#A69C88">routed to human</text>

<rect x="670" y="573" width="200" height="60" rx="8" fill="#1B1712" stroke="#332C22"/>
<text x="770" y="598" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#E3B341">ALLOW</text>
<text x="770" y="616" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#A69C88">proceed to execution</text>

<!-- Replan loop back to agent -->
<path d="M 250 573 C 150 500, 150 260, 328 220" fill="none" stroke="#B8860B" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-gold)"/>
<text x="120" y="400" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#B8860B" transform="rotate(-90 120 400)">AGENT REPLANS</text>

<!-- Execution -->
<line x1="770" y1="633" x2="770" y2="663" stroke="#6E6555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="670" y="666" width="200" height="55" rx="8" fill="#1B1712" stroke="#332C22"/>
<text x="770" y="698" text-anchor="middle" font-family="Arial" font-size="12" fill="#F2EEE5">Payment Simulator</text>

<line x1="670" y1="693" x2="600" y2="693" stroke="#6E6555" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="666" width="330" height="60" rx="8" fill="#1B1712" stroke="#332C22"/>
<text x="225" y="690" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#F2EEE5">Audit Trail (every step logged)</text>
<text x="225" y="708" text-anchor="middle" font-family="Arial" font-size="10" fill="#8A8068">timestamps · recommendation · rule fired · execution result</text>

<path d="M 770 666 C 770 640, 500 640, 500 633" fill="none" stroke="#6E6555" stroke-width="1" stroke-dasharray="3,3"/>

<text x="500" y="750" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#6E6555">The agent never moves money directly -- every action passes the decision engine and policy engine first.</text>
</svg>
